[versions]

aap-clap-hosting-helper = "0.1.1"
aap-core = "0.12.0"

android-compileSdk = "37"
android-minSdk = "29"
android-targetSdk = "37"

agp = "9.4.1"
kotlin = "2.3.21"
ndk = "29.0.14206865"
cmake = "3.31.5"
build-tools = "37.0.0"

core-ktx = "1.16.0"
appcompat = "1.7.0"
activity = "1.10.1"
activity-compose = "1.13.0"
compose-bom = "2026.04.01"

junit = "4.13.2"
test-ext-junit = "1.3.0"
espresso = "3.7.0"

vanniktech-maven-publish = "0.37.0"
oboe = "1.10.0"
compose-audio-controls = "0.7.3"

[libraries]

aap-core = { module = "org.androidaudioplugin:androidaudioplugin", version.ref = "aap-core" }
aap-js-controller = { module = "org.androidaudioplugin:androidaudioplugin-js-controller", version.ref = "aap-core" }

core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
activity = { module = "androidx.activity:activity", version.ref = "activity" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

oboe = { module = "com.google.oboe:oboe", version.ref = "oboe" }
compose-audio-controls = { module = "org.androidaudioplugin:compose-audio-controls", version.ref = "compose-audio-controls" }

junit = { module = "junit:junit", version.ref = "junit" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-ext-junit" }
test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }
